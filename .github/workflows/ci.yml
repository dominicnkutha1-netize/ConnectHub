name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        working-directory: server
        run: npm ci --no-audit --no-fund

      - name: Run tests
        working-directory: server
        run: npm test

      - name: Fail on known vulnerabilities
        working-directory: server
        run: npm audit --omit=dev --audit-level=high

  client:
    name: Client build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: client
        run: npm ci --no-audit --no-fund

      - name: Build production bundle
        working-directory: client
        run: npm run build

      - uses: actions/upload-artifact@v7
        with:
          name: client-dist
          path: client/dist
          retention-days: 7

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: api
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: connecthub:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the running container
        run: |
          set -euo pipefail
          docker run -d --name connecthub-ci \
            -e JWT_SECRET="$(openssl rand -hex 32)" \
            -p 4000:4000 connecthub:ci

          echo "Waiting for the service to become ready..."
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:4000/healthz > /dev/null; then
              echo "ready after ${attempt} attempt(s)"
              break
            fi
            sleep 2
          done

          echo "--- /healthz"
          curl -fsS http://localhost:4000/healthz

          echo "--- /readyz"
          curl -fsS http://localhost:4000/readyz

          echo "--- /metrics (first lines)"
          curl -fsS http://localhost:4000/metrics | head -5

          echo "--- / (built client)"
          status=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:4000/)
          echo "GET / -> ${status}"
          test "${status}" = "200"

      - name: Container must not run as root
        run: |
          set -euo pipefail
          uid=$(docker run --rm --entrypoint id connecthub:ci -u)
          echo "container uid: ${uid}"
          test "${uid}" != "0"

      - name: Container logs
        if: always()
        run: docker logs connecthub-ci || true

      - name: Clean up
        if: always()
        run: docker rm -f connecthub-ci || true
